spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  test:
    database:
      replace: none

logging:
  level:
    org.springframework.test: INFO
    org.springframework.boot.test: INFO
    org.testcontainers: INFO
