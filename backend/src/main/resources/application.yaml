server:
  port: 8081

spring:
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/colpocare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:user}
    password: ${MYSQL_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

api:
  security:
    token:
      secret: ${JWT_SECRET:colpocare-super-secret-key-change-in-production-2026}
      expiration: 7200000
