version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: cervicare_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cervicare
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
