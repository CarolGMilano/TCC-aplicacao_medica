
services:
  db:
    image: mysql:8.0
    container_name: colpocare_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Preencha MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: colpocare
      MYSQL_USER: ${MYSQL_USER:?Preencha MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Preencha MYSQL_PASSWORD no .env}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u root --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: colpocare-backend:dev
    container_name: colpocare_backend
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://db:3306/colpocare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      MYSQL_USER: ${MYSQL_USER:?Preencha MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Preencha MYSQL_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Preencha JWT_SECRET no .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
