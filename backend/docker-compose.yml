version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: cervicare_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Preencha MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: cervicare
      MYSQL_USER: ${MYSQL_USER:?Preencha MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Preencha MYSQL_PASSWORD no .env}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
