
name: cervicare

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cervicare
      MYSQL_USER: ${MYSQL_USER:?Configure MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u root --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cervicare-backend:dev
    environment:
      DB_URL: jdbc:mysql://db:3306/cervicare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      MYSQL_USER: ${MYSQL_USER:?Configure MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    image: cervicare-frontend:dev
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
    external: true
    name: backend_db_data
