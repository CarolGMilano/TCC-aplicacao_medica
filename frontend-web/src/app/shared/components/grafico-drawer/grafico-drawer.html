<section class="drawer">
  <div class="drawer-cabecalho">
    <div class="cabecalho-principal">
      <div class="principal-container">
        <div class="container-elemento"></div>
        <h2 class="container-titulo">{{ data.titulo }}</h2>
      </div>

      <p class="principal-subtitulo">{{ data.subtitulo }}</p>
    </div>

    <button 
      class="cabecalho-botao"
      (click)="fechar()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="drawer-tabela">
    <table class="tabela">
      <thead class="tabela-cabecalho">
        <tr>
          <th>Paciente</th>
          <th>Prontuário</th>
        </tr>
      </thead>

      <tbody class="tabela-corpo">
        @for (item of data.itens; track item.idPaciente) {
          <tr 
            class="corpo-item" 
            [routerLink]="['/pacientes', item.idPaciente]"
            (click)="fechar()">
            <td>{{ item.nome.length > 20 ? (item.nome | slice:0:20) + '...' : item.nome }}</td>
            <td>{{ item.prontuario }}</td>
          </tr>
        } @empty {
          <tr>
            <td class="sem-paciente" colspan="5">
              Nenhum paciente encontrado.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
